include:
  # 동글 (XIAO BLE + OLED 디스플레이)
  - board: xiao_ble//zmk
    shield: totem_dongle dongle_display
    snippet: studio-rpc-usb-uart
    artifact-name: totem_dongle

  # 왼쪽 (peripheral로 변경)
  - board: xiao_ble//zmk
    shield: totem_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: totem_left

  # 오른쪽 (peripheral)
  - board: xiao_ble//zmk
    shield: totem_right
    artifact-name: totem_right
